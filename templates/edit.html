<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canyon Springs Residents</title>
<style>
:root{--ink:#173042;--muted:#61727d;--paper:#f4f0e8;--panel:#fffdf8;--line:#d7d8d1;--teal:#1f7271;--coral:#e17962;--gold:#d6a84f;--shadow:0 14px 35px #17304212}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 10% 0%,#fff8df 0 18%,transparent 38%),linear-gradient(135deg,#f1eee6,#eaf1ee);font:15px/1.45 "Segoe UI",Tahoma,sans-serif}main{max-width:1180px;margin:auto;padding:16px 16px 44px}.masthead{display:flex;justify-content:space-between;align-items:end;gap:16px;border-bottom:2px solid var(--ink);padding:8px 0 14px}.eyebrow{font:700 11px/1.2 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}h1,h2{margin:0;font-weight:500}h1{font-size:clamp(30px,4vw,46px);line-height:1}.date{font:12px system-ui,sans-serif;color:var(--muted);text-align:right}.search{position:relative;margin:24px 0}.search input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:3px;background:#fffdfac9;font:18px "Segoe UI",Tahoma,sans-serif;box-shadow:var(--shadow)}.results{position:absolute;z-index:5;left:0;right:0;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}.results button{display:flex;width:100%;justify-content:space-between;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 16px;text-align:left;color:var(--ink);cursor:pointer}.results button:hover{background:#edf5f1}.results small{color:var(--muted)}.profile{display:none}.profile.active{display:block}.hero{display:flex;justify-content:space-between;align-items:start;gap:16px;background:var(--ink);color:white;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}.hero h2{font-size:26px}.hero .meta{display:flex;gap:20px;font:12px system-ui,sans-serif}.hero strong{display:block;font-size:17px;color:#f6d58a;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section{background:var(--panel);border:1px solid var(--line);padding:14px;box-shadow:0 5px 18px #1730420a}.wide{grid-column:1/-1}.section-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}.section h3{margin:0;font-size:18px;font-weight:500}label{display:block;font:700 11px system-ui,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:6px 0 4px}input,textarea{width:100%;border:1px solid var(--line);background:#fff;padding:7px 8px;border-radius:2px;color:var(--ink);font:15px "Segoe UI",Tahoma,sans-serif}textarea{min-height:54px;resize:vertical}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;border-bottom:1px dashed var(--line);padding-bottom:8px}.row .full{grid-column:1/-1}.row.resident{grid-template-columns:1fr 1fr 72px 1fr 1fr 1fr}.row.contact{grid-template-columns:1fr 1fr 1.4fr}.row.vehicle{grid-template-columns:1.5fr .6fr 1fr}.row>div{min-width:0}.check{display:flex;align-items:center;gap:7px;margin:28px 0 0;font:13px system-ui,sans-serif;color:var(--ink)}.check input{width:auto}.btn{border:1px solid var(--teal);background:var(--teal);color:white;padding:9px 14px;border-radius:2px;font:700 12px system-ui,sans-serif;cursor:pointer}.btn.ghost{background:transparent;color:var(--teal)}.remove{border:0;background:none;color:var(--coral);cursor:pointer;font:12px system-ui,sans-serif;margin-top:27px}.chips{display:flex;gap:9px;flex-wrap:wrap}.chip-input{width:145px}.owner-fields{display:none}.owner-fields.visible{display:block}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.status{font:13px system-ui,sans-serif;color:var(--teal);align-self:center}.empty{color:var(--muted);padding:8px 0;font-style:italic}@media(max-width:760px){main{padding:16px 12px 50px}.masthead{display:block}.date{text-align:left;margin-top:10px}.hero{display:block}.hero .meta{margin-top:22px;gap:18px}.grid{display:block}.section{margin-bottom:14px}.row,.row.resident,.row.contact,.row.vehicle{display:grid;grid-template-columns:1fr 1fr}.row .full{grid-column:1/-1}.row .remove{margin-top:0}.check{margin:10px 0 0}}
body,input,textarea,button{font-family:"Segoe UI",Tahoma,sans-serif}
h1,h2{font-family:"Segoe UI",Tahoma,sans-serif}
.search input{font-family:"Segoe UI",Tahoma,sans-serif}
.row.resident .full{grid-column:1/-1}
.row.resident textarea{min-height:92px}
.suite-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.suite-actions .btn{white-space:nowrap}.actions{flex-wrap:wrap;align-items:center}
.btn:disabled{cursor:not-allowed;opacity:.45}
.menu{position:relative;margin-top:8px;text-align:right}.menu summary{cursor:pointer;color:var(--teal);font-weight:700}.menu a,.menu button{display:block;width:180px;margin-top:4px;padding:8px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:left;text-decoration:none;cursor:pointer;font:13px "Segoe UI",Tahoma,sans-serif}.menu a:hover,.menu button:hover{background:#edf5f1}.directory-link{border:0;background:none;color:var(--teal);cursor:pointer;font:700 16px "Segoe UI",Tahoma,sans-serif!important;padding:0;text-decoration:none}.directory-link:hover{text-decoration:underline}.unit-overlay{display:none;position:fixed;inset:0;z-index:20;background:#17304255;padding:7vh 20px}.unit-overlay.open{display:block}.unit-dialog{width:min(680px,100%);max-height:86vh;margin:auto;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column}.unit-dialog-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.unit-dialog-head h2{font-size:24px}.unit-close{border:0;background:none;color:var(--muted);font-size:24px;line-height:1;cursor:pointer}.unit-list{overflow:auto;padding:8px}.unit-row{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:12px;text-align:left;cursor:pointer;font:14px "Segoe UI",Tahoma,sans-serif}.unit-row:hover{background:#edf5f1}.unit-row strong{font-size:16px}.unit-row small{color:var(--muted)}
@media print{body{background:#fff;color:#000}.masthead,.search,#empty,.actions,.btn,.remove,.section-head button{display:none!important}.profile,.profile.active{display:block}.hero{color:#000;background:#fff;border-bottom:2px solid #000;box-shadow:none;padding:0 0 12px}.hero .eyebrow{color:#000!important}.hero strong{color:#000}.grid{display:block}.section{box-shadow:none;border:0;border-bottom:1px solid #bbb;padding:12px 0}.section h3{font-size:16px}.section input,.section textarea{border:0;padding:2px 0;background:transparent}.owner-fields{display:block!important}.row{break-inside:avoid}}
.directory-link{font-size:16px;font-weight:700}#today{font-size:15px}
.date{font-size:15px!important}
</style>
<style>
.theme-btn{border:1px solid var(--teal);background:transparent;color:var(--teal);padding:2px 10px;border-radius:3px;font:700 12px system-ui,sans-serif;cursor:pointer;text-transform:uppercase}
:root[data-theme="dark"]{--ink:#e6edf3;--muted:#8b9eb0;--panel:#1b242c;--line:#2d3843;--teal:#3dbdb6;--coral:#ff7b72;--gold:#f2c94c;--shadow:0 14px 35px #00000050}
:root[data-theme="dark"] body{background:radial-gradient(circle at 10% 0%,#1b242c 0 18%,transparent 38%),linear-gradient(135deg,#12161b,#0f1418)}
:root[data-theme="dark"] .hero{background:#22303c;box-shadow:0 14px 35px #00000050}
:root[data-theme="dark"] .search input,:root[data-theme="dark"] input,:root[data-theme="dark"] textarea{background:#12181d}
:root[data-theme="dark"] .results button:hover,:root[data-theme="dark"] .menu a:hover,:root[data-theme="dark"] .menu button:hover,:root[data-theme="dark"] .unit-row:hover{background:#25313d}
:root[data-theme="dark"] .unit-overlay{background:#0d1117cc}
</style>
<script>
(function(){try{if(localStorage.getItem('cs_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}}());
function toggleTheme(){var h=document.documentElement,d=h.getAttribute('data-theme')==='dark'?'':'dark';h.setAttribute('data-theme',d);try{localStorage.setItem('cs_theme',d);}catch(e){}}
</script>
</head>
<body><main>
<header class="masthead"><div><div class="eyebrow">Canyon Springs · Resident records</div><h1>Unit Sheet</h1></div><div class="date"><button class="theme-btn" onclick="toggleTheme()">Dark</button><br><a class="directory-link" href="/units">&larr; All Units</a> · <form method="POST" action="/logout" style="display:inline"><button style="background:none;border:0;padding:0;color:var(--teal);font-weight:700;cursor:pointer;font-size:13px">Sign out</button></form><br><span id="today"></span></div></header>
<div id="empty" class="empty">Loading unit…</div>
<section id="profile" class="profile"><div class="hero"><div><div class="eyebrow" style="color:#f6d58a">Unit profile</div><h2>#<span id="suite-title">New</span></h2></div><div class="meta"><div>DOOR ENTERCODE<strong id="hero-code">—</strong></div><div>KEY SET<strong id="hero-key">—</strong></div></div><div class="suite-actions"><button class="btn" onclick="printUnitRecord()">Print Unit Record</button><button id="top-save" class="btn" onclick="saveSuite()" disabled>Save Unit Record</button><button class="btn ghost" onclick="closeSuite()">Close Unit Record</button><button id="top-edit" class="btn ghost" onclick="editUnit()">Edit Unit Record</button></div></div>
<div class="grid"><section class="section wide"><div class="section-head"><h3>Unit details</h3></div><div class="row vehicle"><div><label>Unit number</label><input id="suite-id" maxlength="4" placeholder="602"></div><div><label>Door Entercode</label><input id="entercode"></div><div><label>Backup key set #</label><input id="keyset"></div></div></section>
<section class="section wide"><div class="section-head"><h3>Residents</h3><button class="btn ghost" onclick="addResident()">+ Add resident</button></div><div id="residents"></div></section>
<section class="section"><div class="section-head"><h3>Vehicles</h3><button class="btn ghost" onclick="addVehicle()">+ Add vehicle</button></div><div id="vehicles"></div></section>
<section class="section"><div class="section-head"><h3>Parking & lockers</h3></div><label>Parking spot numbers</label><div id="parking" class="chips"></div><button class="btn ghost" onclick="addChip('parking')">+ Add spot</button><label>Locker numbers</label><div id="lockers" class="chips"></div><button class="btn ghost" onclick="addChip('lockers')">+ Add locker</button></section>
<section class="section wide"><div class="section-head"><h3>Owner details</h3><label class="check"><input id="owner-resident" type="checkbox" checked onchange="toggleOwner()"> Owner lives in unit</label></div><div id="owner-fields" class="owner-fields"><div class="row vehicle"><div><label>Name</label><input data-owner="owner_name"></div><div class="full"><label>Address</label><input data-owner="address"></div></div><div class="row vehicle"><div><label>Phone # - Cell</label><input data-phone data-owner="phone_cell" inputmode="tel" pattern="[0-9+\-]*"></div><div><label>Phone # - Home</label><input data-phone data-owner="phone_home" inputmode="tel" pattern="[0-9+\-]*"></div><div><label>Phone # - Business</label><input data-phone data-owner="phone_business" inputmode="tel" pattern="[0-9+\-]*"></div></div></div></section>
<section class="section wide"><div class="section-head"><h3>Emergency contacts</h3><button class="btn ghost" onclick="addContact()">+ Add contact</button></div><div id="contacts"></div></section></div><div class="actions"><span id="status" class="status"></span><button class="btn" onclick="printUnitRecord()">Print Unit Record</button><button id="bottom-save" class="btn" onclick="saveSuite()" disabled>Save Unit Record</button><button class="btn ghost" onclick="closeSuite()">Close Unit Record</button><button id="bottom-edit" class="btn ghost" onclick="editUnit()">Edit Unit Record</button></div></section>
</main>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let current={residents:[],vehicles:[],emergency_contacts:[],parking_spots:[],lockers:[],owner:{}};
let isDirty=false;
let isEditing=false;
function setEditMode(value){isEditing=value;document.querySelectorAll('#profile input,#profile textarea').forEach(control=>control.disabled=!value);document.querySelectorAll('#profile .section button,#profile .remove').forEach(control=>control.disabled=!value);$('#top-edit').style.display=value?'none':'inline-block';$('#bottom-edit').style.display=value?'none':'inline-block';$('#top-save').disabled=!value||!isDirty;$('#bottom-save').disabled=!value||!isDirty;}
function setDirty(value=true){if(renderSilent&&value)return;isDirty=value;$('#top-save').disabled=!isEditing||!value;$('#bottom-save').disabled=!isEditing||!value;}
$('#today').textContent=new Intl.DateTimeFormat('en',{dateStyle:'long'}).format(new Date());
async function loadSuite(id,editing=false){let r=await fetch('/suite/'+encodeURIComponent(id),{headers:{Accept:'application/json'}});if(!r.ok)return newSuite(id);fill(await r.json(),false);}
function newSuite(id){fill({suite_id:(id||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4),owner_is_resident:true,residents:[],vehicles:[],emergency_contacts:[],parking_spots:[],lockers:[],owner:{}},true);}
let bootId=new URLSearchParams(window.location.search).get('id')||'';
if(bootId){loadSuite(bootId.toUpperCase(),false);}else{$('#empty').textContent='No unit selected. Go back to All Units and pick one.';}
function fill(data,editing){current=data;renderSilent=true;isDirty=false;isEditing=editing;$('#empty').style.display='none';$('#profile').classList.add('active');$('#suite-id').value=data.suite_id||'';$('#suite-title').textContent=data.suite_id||'New';$('#entercode').value=data.entercode||'';$('#keyset').value=data.backup_keyset_num||'';$('#hero-code').textContent=data.entercode||'—';$('#hero-key').textContent=data.backup_keyset_num||'—';$('#owner-resident').checked=data.owner_is_resident!==false;$('#owner-fields').classList.toggle('visible',!$('#owner-resident').checked);document.querySelectorAll('[data-owner]').forEach(i=>i.value=(data.owner||{})[i.dataset.owner]||'');renderAll(true);setEditMode(editing);}
let renderSilent=false;
function renderAll(silent){let d=current;renderSilent=!!silent;$('#residents').innerHTML='';(d.residents||[]).forEach(x=>addResident(x,0));$('#vehicles').innerHTML='';(d.vehicles||[]).forEach(x=>addVehicle(x));$('#contacts').innerHTML='';(d.emergency_contacts||[]).forEach(x=>addContact(x));['parking','lockers'].forEach(k=>{$('#'+k).innerHTML='';(d[k+'_spots']||d[k]||[]).forEach(x=>addChip(k,x));});renderSilent=false;setDirty(false);}
function addResident(x={},i){let el=document.createElement('div');el.className='row resident';el.innerHTML=`<div><label>First name</label><input data-field="first_name" value="${esc(x.first_name)}"></div><div><label>Last name</label><input data-field="last_name" value="${esc(x.last_name)}"></div><label class="check"><input data-field="is_child" type="checkbox" ${x.is_child?'checked':''} onchange="this.closest('.row').querySelector('[data-field=child_age]').disabled=!this.checked"> Child?</label><div><label>Age</label><input data-field="child_age" type="number" value="${esc(x.child_age)}" ${x.is_child?'':'disabled'}></div><div><label>Phone # - Cell</label><input data-phone data-field="phone_cell" inputmode="tel" pattern="[0-9+\-]*" value="${esc(x.phone_cell)}"></div><div><label>Phone # - Home</label><input data-phone data-field="phone_home" inputmode="tel" pattern="[0-9+\-]*" value="${esc(x.phone_home)}"></div><div><label>Phone # - Business</label><input data-phone data-field="phone_business" inputmode="tel" pattern="[0-9+\-]*" value="${esc(x.phone_business)}"></div><div class="full"><label>Medical notes</label><textarea data-field="medical_notes">${esc(x.medical_notes)}</textarea></div><div class="full"><label>Fire dept notes</label><input data-field="fire_notes" value="${esc(x.fire_notes)}"></div><button class="remove" onclick="this.parentElement.remove()">Remove</button>`;$('#residents').append(el);setDirty()}
function addVehicle(x={}){let el=document.createElement('div');el.className='row vehicle';el.innerHTML=`<div><label>Make & model</label><input data-field="make_model" value="${esc(x.make_model)}"></div><div><label>Year</label><input data-field="year" value="${esc(x.year)}"></div><div><label>License plate</label><input data-field="plate_number" value="${esc(x.plate_number)}"></div><button class="remove" onclick="this.parentElement.remove()">Remove</button>`;$('#vehicles').append(el);setDirty()}
function addContact(x={}){let el=document.createElement('div');el.className='row contact';el.innerHTML=`<div><label>Name</label><input data-field="contact_name" value="${esc(x.contact_name)}"></div><div><label>Relationship</label><input data-field="relationship" value="${esc(x.relationship)}"></div><div class="full"><label>Address</label><input data-field="address" value="${esc(x.address)}"></div><div><label>Phone # - Cell</label><input data-phone data-field="phone_cell" inputmode="tel" pattern="[0-9+\-]*" value="${esc(x.phone_cell)}"></div><div><label>Phone # - Home</label><input data-phone data-field="phone_home" inputmode="tel" pattern="[0-9+\-]*" value="${esc(x.phone_home)}"></div><div><label>Phone # - Business</label><input data-phone data-field="phone_business" inputmode="tel" pattern="[0-9+\-]*" value="${esc(x.phone_business)}"></div><div class="full"><label>Notes</label><textarea data-field="notes">${esc(x.notes)}</textarea></div><button class="remove" onclick="this.parentElement.remove()">Remove</button>`;$('#contacts').append(el);setDirty()}
function addChip(type,value=''){let el=document.createElement('div');el.innerHTML=`<input class="chip-input" data-chip="${type}" placeholder="Number" value="${esc(value)}">`;$('#'+type).append(el);setDirty()}
function toggleOwner(){$('#owner-fields').classList.toggle('visible',!$('#owner-resident').checked)}
function editUnit(){setEditMode(true)}
document.addEventListener('input',e=>{if(e.target.matches('[data-phone]'))e.target.value=e.target.value.replace(/[^0-9+\-]/g,'');if(e.target.closest('#profile'))setDirty()})
document.addEventListener('change',e=>{if(e.target.closest('#profile'))setDirty()})
document.addEventListener('click',e=>{if(e.target.closest('#profile')&&e.target.matches('.remove'))setDirty()})
function collect(){let suite={suite_id:$('#suite-id').value.trim().toUpperCase(),entercode:$('#entercode').value,backup_keyset_num:$('#keyset').value,owner_is_resident:$('#owner-resident').checked,residents:[],vehicles:[],emergency_contacts:[],parking_spots:[],lockers:[],owner:{}};document.querySelectorAll('#residents .row').forEach(row=>{let o={};row.querySelectorAll('[data-field]').forEach(i=>o[i.dataset.field]=i.type==='checkbox'?i.checked:i.value);o.child_age=o.child_age?Number(o.child_age):null;suite.residents.push(o)});['vehicles','emergency_contacts'].forEach(k=>document.querySelectorAll('#'+(k==='vehicles'?'vehicles':'contacts')+' .row').forEach(row=>{let o={};row.querySelectorAll('[data-field]').forEach(i=>o[i.dataset.field]=i.value);suite[k].push(o)}));['parking','lockers'].forEach(k=>suite[k==='parking'?'parking_spots':'lockers']=[...document.querySelectorAll('[data-chip='+k+']')].map(i=>i.value.trim()).filter(Boolean));document.querySelectorAll('[data-owner]').forEach(i=>suite.owner[i.dataset.owner]=i.value);document.querySelectorAll('[data-phone]').forEach(i=>i.value=i.value.replace(/[^0-9+\-]/g,''));return suite}
function closeSuite(){if(isDirty&&!window.confirm('Changes have been made to this suite. Close without saving?'))return;window.location.href='/units';}
function printUnitRecord(){if(!$('#profile').classList.contains('active')){setStatus('Open a unit before creating a PDF.');return;}window.location.href='/suite/pdf/'+encodeURIComponent($('#suite-id').value.trim());}
async function saveSuite(){let data=collect();if(!/^[A-Z0-9]{3,4}$/.test(data.suite_id)){setStatus('Enter a 3–4 character unit number.');return;}if(!data.owner_is_resident){let o=data.owner||{};if(!(o.owner_name||'').trim()){setStatus('Enter an owner name when the owner does not live in the unit.');return;}if(!(o.phone_cell||'').trim()&&!(o.phone_home||'').trim()&&!(o.phone_business||'').trim()){setStatus('Enter at least one owner phone number.');return;}}setStatus('Saving…');let r=await fetch('/suite/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(r.ok){window.location.href='/units';}else setStatus(await r.text());}
function setStatus(x){$('#status').textContent=x;setTimeout(()=>$('#status').textContent='',4000)}
</script></body></html>
